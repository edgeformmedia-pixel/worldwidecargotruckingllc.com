<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | Worldwide Cargo Express</title>
  <link rel="stylesheet" href="../../account/account.css">
  <script src="../../api-client.js"></script>
  <script src="../../account/verification.js" defer></script>
  <script src="../../account/create/create.js" defer></script>
  <script src="../../i18n.js" defer></script>
</head>
<body>
  <div class="topline"></div>
  <header><a href="../../"><img src="../../assets/worldwide-cargo-express-logo-transparent.png" alt="Worldwide Cargo Express LLC"></a><nav><a href="../../account/index.html">Sign in</a></nav></header>
  <main>
    <section class="card login">
      <div id="createView">
        <p class="eyebrow">Get started</p><h1>Create account</h1><p>Create a portal account for driving, arranging freight, or shipping your own freight.</p>
        <form id="createForm">
          <label>Account type<select id="role" required><option value="">Choose one</option><option value="driver">Driver</option><option value="broker">Freight broker</option><option value="shipper">Direct shipper</option></select></label>
          <label id="driverTypeWrap" hidden>Driver type<select id="driverType"><option value="">Choose one</option><option value="owner_operator">Owner-operator</option><option value="company_driver">Company driver</option></select></label>
          <label>Full name<input id="fullName" autocomplete="name" required maxlength="120"></label>
          <label>Email<input id="email" type="email" autocomplete="email" required maxlength="180"></label>
          <label>Phone number<input id="phone" type="tel" autocomplete="tel" required maxlength="30"></label>
          <label>Password<input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
          <label>Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
          <p class="error" id="error" role="alert"></p><button class="primary" type="submit">Create account</button>
        </form>
        <p class="create-link">Already have an account? <a href="../../account/index.html">Sign in</a></p>
      </div>
      <div class="verification" id="createVerification" hidden>
        <p class="eyebrow">Check your inbox</p><h1>Verify your email</h1><p>We sent a five-digit code to <strong data-verification-email></strong>.</p>
        <form><label>Verification code<input class="code-input" data-verification-code inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{5}" maxlength="5" required></label><p class="error" data-verification-error role="alert"></p><button class="primary" type="submit">Verify email</button></form>
        <button class="text-button" data-resend-code type="button">Send a new code</button>
      </div>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Account | Worldwide Cargo Express</title><link rel="stylesheet" href="/worldwidecargotruckingllc.com/account/account.css"><script src="/worldwidecargotruckingllc.com/api-client.js"></script><script src="/worldwidecargotruckingllc.com/account/create/create.js" defer></script></head>
<body><div class="topline"></div><header><a href="/worldwidecargotruckingllc.com/"><img src="/worldwidecargotruckingllc.com/assets/worldwide-cargo-express-logo-transparent.png" alt="Worldwide Cargo Express LLC"></a><nav><a href="/worldwidecargotruckingllc.com/account/index.html">Sign in</a></nav></header><main><section class="card login"><p class="eyebrow">Get started</p><h1>Create account</h1><p>Create a portal account for driving, arranging freight, or shipping your own freight.</p><form id="createForm"><label>Account type<select id="role" required><option value="">Choose one</option><option value="driver">Driver</option><option value="broker">Freight broker</option><option value="shipper">Direct shipper</option></select></label><label id="driverTypeWrap" hidden>Driver type<select id="driverType"><option value="">Choose one</option><option value="owner_operator">Owner-operator</option><option value="company_driver">Company driver</option></select></label><label>Full name<input id="fullName" autocomplete="name" required maxlength="120"></label><label>Email<input id="email" type="email" autocomplete="email" required maxlength="180"></label><label>Phone number<input id="phone" type="tel" autocomplete="tel" required maxlength="30"></label><label>Password<input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label>Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><p class="error" id="error" role="alert"></p><button class="primary" type="submit">Create account</button></form><p class="create-link">Already have an account? <a href="/worldwidecargotruckingllc.com/account/index.html">Sign in</a></p></section></main></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>My Account | Worldwide Cargo Express</title>
  <link rel="stylesheet" href="../account/account.css">
  <script src="../api-client.js"></script>
  <script src="../account/account.js" defer></script>
</head>
<body>
  <div class="topline"></div>
  <header><a href="../"><img src="../assets/worldwide-cargo-express-logo-transparent.png" alt="Worldwide Cargo Express LLC"></a><nav><a href="../quote/index.html">Request a quote</a><a href="../apply/index.html">Apply to drive</a><button id="logoutButton" type="button" hidden>Log out</button></nav></header>
  <main>
    <section class="card login" id="loginView">
      <p class="eyebrow">Your portal</p><h1>Sign in</h1><p>View your application, quotes, and driver offers.</p>
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <p class="error" id="loginError" role="alert"></p><button class="primary" type="submit">Sign in</button>
      </form>
      <p class="create-link">Need an account? <a href="../account/create/index.html">Create one</a></p>
      <p class="create-link"><a href="../account/recover/index.html">Forgot your password?</a></p>
    </section>

    <section id="dashboard" hidden>
      <div class="welcome"><div><p class="eyebrow">Account dashboard</p><h1 id="welcomeName">Welcome</h1><p id="accountDetails"></p></div><span class="role" id="roleBadge"></span></div>
      <section class="panel" id="applicationsPanel"><div class="panel-head"><h2>Driver application</h2><a href="../apply/index.html">Start an application</a></div><div class="cards" id="applications"></div></section>
      <section class="panel" id="offersPanel"><div class="panel-head"><h2>Driver offers</h2></div><div class="cards" id="offers"></div></section>
      <section class="panel"><div class="panel-head"><h2>Quote history</h2><a href="../quote/index.html">Request a quote</a></div><div class="cards" id="quotes"></div></section>
    </section>
  </main>
</body>
</html>
